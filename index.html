<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML 문서 공유</title>
  <style>
    :root { color-scheme: light; }
    body { max-width: 760px; margin: 0 auto; padding: 3rem 1.25rem; font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; line-height: 1.7; color: #1f2937; }
    h1 { color: #143d2a; }
    .notice { padding: 1rem 1.25rem; border-left: 4px solid #2f855a; background: #f0fff4; border-radius: 4px; }
    footer { margin-top: 3rem; color: #6b7280; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>HTML 문서 공유</h1>
    <p class="notice">이 페이지는 GitHub에 올리면 자동으로 공개 배포됩니다.</p>
    <p><strong>편집 방법:</strong> <code>index.html</code> 내용을 수정하고 GitHub에 올리면 됩니다.</p>
  </main>
  <footer>GitHub Pages로 배포</footer>
</body>
</html>
